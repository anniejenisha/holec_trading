[project]
name = "holec_trading"
authors = [
    { name = "Holec", email = "ops@holec.co.ke" }
]
description = "Maize trading system: Lot lifecycle, Cost Ledger, Charge Master"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pytesseract",
    "pdf2image",
    "Pillow"
]

[deploy.dependencies.apt]
packages = [
    "tesseract-ocr",
    "poppler-utils"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"