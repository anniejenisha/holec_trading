[project]
name = "holec_trading"
authors = [
    { name = "Holec", email = "ops@holec.co.ke" }
]
description = "Maize trading system: Lot lifecycle, Cost Ledger, Charge Master"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "openai>=1.50.0",
    "aiohttp>=3.11.0"
]

[deploy.dependencies.apt]
packages = [
    "tesseract-ocr"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"